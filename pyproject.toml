[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeglyph"
version = "0.1.0"
description = "Structure-aware, font-matched image-to-glyph art"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nene465" }]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.scripts]
edgeglyph = "edgeglyph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
