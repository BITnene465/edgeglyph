[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeglyph"
version = "0.5.0"
description = "Terminal art, structure-aware glyph rendering, and fuse-bead patterns"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "nene465" }]
keywords = [
  "ascii-art",
  "fuse-beads",
  "image-to-ascii",
  "neovim",
  "terminal-art",
  "unicode",
]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.scripts]
edgeglyph = "edgeglyph.cli:main"

[project.urls]
Homepage = "https://github.com/BITnene465/edgeglyph"
Repository = "https://github.com/BITnene465/edgeglyph.git"
Issues = "https://github.com/BITnene465/edgeglyph/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"edgeglyph.web" = ["static/*"]
